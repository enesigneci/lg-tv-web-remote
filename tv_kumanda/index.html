<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title data-i18n="title">TV Kumanda</title>
<style>
  :root { --bg:#111; --fg:#eee; --muted:#888; --btn:#232323; --btn-active:#3a3a3a; --accent:#c8102e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px -apple-system, system-ui, sans-serif;
         padding:16px; padding-top:max(16px, env(safe-area-inset-top)); }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  #status { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #status::before { content:""; width:8px; height:8px; border-radius:50%; background:#666; }
  #status.ok::before { background:#3c3; }
  #status.warn::before { background:#fc3; }
  #text, .field { width:100%; font-size:20px; padding:14px; border-radius:12px; border:1px solid #333;
          background:#1b1b1b; color:var(--fg); outline:none; }
  #text:focus, .field:focus { border-color:var(--accent); }
  .hint { color:var(--muted); font-size:13px; margin:8px 2px 16px; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px; }
  .row.four { grid-template-columns:repeat(4,1fr); }
  button { border:0; border-radius:12px; background:var(--btn); color:var(--fg); font-size:17px;
           padding:16px 0; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  button:active { background:var(--btn-active); }
  button.primary { background:var(--accent); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:300px; margin:18px auto; }
  .pad button { aspect-ratio:1.4; font-size:22px; }
  .tabs { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; background:#1b1b1b; padding:4px; border-radius:12px; margin-bottom:14px; }
  .tabs button { padding:10px 0; font-size:12px; background:transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tabs button.on { background:var(--btn-active); }
  .hidden { display:none !important; }
  .bar { display:grid; grid-template-columns:1fr 1.1fr 1fr 1.1fr; gap:8px; margin-bottom:14px; }
  .bar button { padding:12px 0; font-size:17px; }
  #mute.muted { background:#3a3214; color:#fc3; }
  .meta { display:flex; align-items:center; gap:12px; }
  #lang { padding:4px 8px; font-size:12px; border-radius:8px; color:var(--muted); }
  #volume { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #power { background:#3a1414; color:#ff6b6b; }
  #ytForm, #webForm { display:flex; gap:8px; }
  #ytForm input, #webForm input { flex:1; min-width:0; }
  #ytForm button, #webForm button { padding:0 18px; }
  #ytResults { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .vid { display:flex; gap:10px; background:#1b1b1b; border-radius:12px; overflow:hidden; text-align:left; padding:0; }
  .vid img { width:136px; aspect-ratio:16/9; object-fit:cover; flex-shrink:0; }
  .vid div { padding:8px 8px 8px 0; min-width:0; }
  .vid b { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:15px; font-weight:600; }
  .vid small { color:var(--muted); font-size:12px; display:block; margin-top:4px; }
  #touchpad { height:280px; border-radius:16px; background:#1b1b1b; border:1px solid #2c2c2c; touch-action:none;
              display:flex; align-items:center; justify-content:center; color:#555; font-size:14px; text-align:center;
              margin-bottom:10px; user-select:none; -webkit-user-select:none; }
  #touchpad.active { border-color:var(--accent); }
  h2 { font-size:14px; color:var(--muted); font-weight:600; margin:4px 2px 10px; }
  .apps { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:10px; margin-bottom:18px; }
  .app { padding:12px 6px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12px; line-height:1.25; }
  .app img { width:52px; height:52px; object-fit:contain; border-radius:10px; }
  .app span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .app.off { opacity:.45; }
  #kbView h2 { margin-top:22px; }
  #msgForm { display:flex; flex-direction:column; gap:8px; }
  #msgForm .field { font-size:17px; padding:12px; font-family:inherit; }
  #msgForm textarea { resize:vertical; min-height:72px; }
  .msgRow { display:grid; grid-template-columns:110px 1fr; gap:8px; }
  .msgRow button { padding:12px 0; }
  #chTools { display:flex; gap:8px; margin-bottom:12px; }
  #chTools input { flex:1; min-width:0; font-size:17px; padding:12px; }
  #chRadio { padding:0 14px; font-size:14px; }
  #chRadio.on { background:var(--btn-active); color:#fc3; }
  #chList { display:flex; flex-direction:column; gap:8px; }
  .ch { display:grid; grid-template-columns:40px 1fr; grid-template-rows:auto auto auto; gap:3px 10px; align-items:center; text-align:left; padding:10px 14px; }
  .ch.current { outline:2px solid var(--accent); }
  .ch .num { grid-row:1 / 4; font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
  .ch .name { font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ch .now { font-size:13px; color:var(--muted); min-height:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ch .bar { display:block; grid-column:2; height:3px; margin:3px 0 2px; background:#333; border-radius:2px; overflow:hidden; }
  .ch .bar i { display:block; height:100%; width:0; background:var(--accent); }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">TV Kumanda</h1>
  <div class="meta">
    <span id="volume"></span>
    <span id="status"></span>
    <button id="lang" aria-label="Language"></button>
  </div>
</header>

<div class="bar">
  <button data-btn="VOLUMEDOWN" data-i18n-aria="volDown">🔉 −</button>
  <button id="mute" data-btn="MUTE" data-i18n-aria="mute">🔇</button>
  <button data-btn="VOLUMEUP" data-i18n-aria="volUp">🔊 +</button>
  <button id="power" data-i18n-aria="powerAria" data-i18n="power"></button>
</div>

<div class="tabs">
  <button id="tabKb" class="on" data-i18n="tabRemote"></button>
  <button id="tabYt">▶ YouTube</button>
  <button id="tabWeb">🌐 Web</button>
  <button id="tabCh" data-i18n="tabChannels"></button>
  <button id="tabApps" data-i18n="tabApps"></button>
</div>

<section id="kbView">
  <input id="text" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"
         data-i18n-ph="typeHere" enterkeyhint="send">
  <div class="hint" data-i18n="typeHint"></div>

  <div class="row">
    <button data-act="back1" data-i18n="delete"></button>
    <button data-act="clear" data-i18n="clear"></button>
    <button data-act="enter" class="primary">Enter ⏎</button>
  </div>

  <div class="pad">
    <span></span><button data-btn="UP">▲</button><span></span>
    <button data-btn="LEFT">◀</button><button data-btn="ENTER" class="primary">OK</button><button data-btn="RIGHT">▶</button>
    <span></span><button data-btn="DOWN">▼</button><span></span>
  </div>
  <div class="row">
    <button data-btn="BACK" data-i18n="back"></button>
    <button data-btn="HOME" data-i18n="home"></button>
    <button data-btn="MENU" data-i18n="settings"></button>
  </div>
  <div class="row four">
    <button data-btn="REWIND" data-i18n-aria="rewind">⏪</button>
    <button data-btn="PLAY" data-i18n-aria="play">▶</button>
    <button data-btn="PAUSE" data-i18n-aria="pause">⏸</button>
    <button data-btn="FASTFORWARD" data-i18n-aria="forward">⏩</button>
  </div>

  <h2 data-i18n="msgTitle"></h2>
  <form id="msgForm">
    <input id="msgHead" class="field" type="text" data-i18n-ph="msgHeadPh" autocomplete="off" maxlength="80">
    <textarea id="msgText" class="field" rows="3" data-i18n-ph="msgTextPh" maxlength="300" required></textarea>
    <div class="msgRow">
      <select id="msgSecs" class="field" data-i18n-aria="msgSecs">
        <option value="5">5 sn</option>
        <option value="10">10 sn</option>
        <option value="15" selected>15 sn</option>
        <option value="30">30 sn</option>
        <option value="60">60 sn</option>
      </select>
      <button class="primary" data-i18n="msgSend"></button>
    </div>
    <div id="msgStatus" class="hint"></div>
  </form>
</section>

<section id="ytView" class="hidden">
  <form id="ytForm">
    <input id="ytQ" class="field" type="search" data-i18n-ph="ytSearch" enterkeyhint="search" autocomplete="off">
    <button class="primary" data-i18n="search"></button>
  </form>
  <div id="ytResults"></div>
</section>

<section id="webView" class="hidden">
  <form id="webForm">
    <input id="webQ" class="field" type="text" inputmode="url" data-i18n-ph="webPh" enterkeyhint="go"
           autocomplete="off" autocapitalize="none" spellcheck="false">
    <button class="primary" data-i18n="open"></button>
  </form>
  <div class="hint" data-i18n="webHint"></div>
  <div id="webStatus" class="hint"></div>
  <div id="touchpad" data-i18n-html="touchpad"></div>
  <div class="row">
    <button data-btn="BACK" data-i18n="back"></button>
    <button data-btn="HOME" data-i18n="home"></button>
    <button data-btn="ENTER">OK</button>
  </div>
</section>

<section id="chView" class="hidden">
  <div id="chTools">
    <input id="chQ" class="field" type="search" data-i18n-ph="chSearch" autocomplete="off">
    <button id="chRadio" data-i18n="radio"></button>
  </div>
  <div id="chEmpty" class="hint" data-i18n="chEmpty"></div>
  <div id="chList"></div>
</section>

<section id="appsView" class="hidden">
  <div id="appsEmpty" class="hint" data-i18n="appsEmpty"></div>
  <h2 id="inputsTitle" class="hidden" data-i18n="inputs"></h2>
  <div id="inputList" class="apps"></div>
  <h2 id="appsTitle" class="hidden" data-i18n="apps"></h2>
  <div id="appList" class="apps"></div>
</section>

<script>
  const STRINGS = {
    tr: {
      title: 'TV Kumanda', connected: 'TV bağlı', prompt: "TV'de isteği onayla", disconnected: 'TV bağlı değil',
      offline: 'sunucu yok', connecting: 'bağlanıyor…', muted: 'Sessiz',
      volDown: 'Sesi kıs', mute: 'Sessiz', volUp: 'Sesi aç', power: '⏻ Güç', powerAria: "TV'yi aç/kapat",
      tabRemote: '⌨ Kumanda', tabApps: '▦ Uyg.',
      typeHere: "Buraya yaz, TV'de görünsün",
      typeHint: "TV'de önce bir arama kutusu seç, ekran klavyesi açılsın. Sonra buraya yaz.",
      delete: '⌫ Sil', clear: 'Temizle', back: '↩ Geri', home: '⌂ Ana', settings: '⚙ Ayar',
      rewind: 'Geri sar', play: 'Oynat', pause: 'Duraklat', forward: 'İleri sar',
      ytSearch: "YouTube'da ara", search: 'Ara', searching: 'Aranıyor…', noResults: 'Sonuç yok.',
      searchFailed: 'Arama başarısız.', live: 'canlı',
      webPh: 'Adres, arama ya da YouTube linki', open: 'Aç', opening: "TV'de açılıyor: {q}",
      webHint: "Adres yazarsan TV tarayıcısında açılır, başka bir şey yazarsan {engine}'te aranır. YouTube linki YouTube uygulamasında açılır.",
      touchpad: 'Touchpad<br>Sürükle: imleç · Dokun: tıkla<br>İki parmak: kaydır',
      appsEmpty: 'TV bağlanınca uygulamalar burada görünür.', inputs: 'Girişler', apps: 'Uygulamalar',
      msgTitle: "TV'ye mesaj", msgHeadPh: 'Başlık (isteğe bağlı)', msgTextPh: "TV'de görünecek mesaj",
      msgSecs: 'Ekranda kalma süresi', msgSend: 'Gönder', msgSent: "Gönderildi, TV'de görünüyor.",
      msgOff: 'TV bağlı değil, mesaj gönderilemedi.', msgFailed: 'Mesaj gönderilemedi.',
      tabChannels: '📺 Kanal', chSearch: 'Kanal ara', radio: 'Radyo', noInfo: 'Yayın bilgisi yok', next: 'Sonra',
      chEmpty: 'TV bağlanınca kanal listesi burada görünür.',
    },
    en: {
      title: 'TV Remote', connected: 'TV connected', prompt: 'Accept the request on the TV', disconnected: 'TV not connected',
      offline: 'server offline', connecting: 'connecting…', muted: 'Muted',
      volDown: 'Volume down', mute: 'Mute', volUp: 'Volume up', power: '⏻ Power', powerAria: 'Turn TV on/off',
      tabRemote: '⌨ Remote', tabApps: '▦ Apps',
      typeHere: 'Type here to send to the TV',
      typeHint: 'First select a text field on the TV so its on-screen keyboard opens, then type here.',
      delete: '⌫ Delete', clear: 'Clear', back: '↩ Back', home: '⌂ Home', settings: '⚙ Settings',
      rewind: 'Rewind', play: 'Play', pause: 'Pause', forward: 'Fast forward',
      ytSearch: 'Search YouTube', search: 'Search', searching: 'Searching…', noResults: 'No results.',
      searchFailed: 'Search failed.', live: 'live',
      webPh: 'Address, search or YouTube link', open: 'Open', opening: 'Opening on TV: {q}',
      webHint: 'Addresses open in the TV browser; anything else is searched on {engine}. YouTube links open in the YouTube app.',
      touchpad: 'Touchpad<br>Drag: move cursor · Tap: click<br>Two fingers: scroll',
      appsEmpty: 'Apps appear here once the TV is connected.', inputs: 'Inputs', apps: 'Apps',
      msgTitle: 'Message on TV', msgHeadPh: 'Title (optional)', msgTextPh: 'Message to show on the TV',
      msgSecs: 'How long it stays on screen', msgSend: 'Send', msgSent: 'Sent, showing on the TV.',
      msgOff: 'TV not connected, message not sent.', msgFailed: 'Could not send the message.',
      tabChannels: '📺 TV', chSearch: 'Search channels', radio: 'Radio', noInfo: 'No program info', next: 'Next',
      chEmpty: 'Channels appear here once the TV is connected.',
    },
  };

  // Start in the phone's language; the header button switches it and the choice is remembered.
  let lang = (navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en';
  try { const saved = localStorage.getItem('lang'); if (STRINGS[saved]) lang = saved; } catch {}
  let engine = 'Yandex', statusKey = 'connecting', volumeState = null;
  let channels = [], current = null, showRadio = false;
  const t = (key, vars = {}) => STRINGS[lang][key].replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n, { engine }); });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    document.getElementById('lang').textContent = lang === 'tr' ? 'EN' : 'TR';
    for (const o of document.querySelectorAll('#msgSecs option')) o.textContent = `${o.value} ${lang === 'tr' ? 'sn' : 's'}`;
    setStatus(statusKey);
    setVolume(volumeState);
    if (channels.length) renderChannels();
  }

  const input = document.getElementById('text');
  const statusEl = document.getElementById('status');
  let ws, last = '';

  function setStatus(s) {
    statusKey = s;
    const cls = { connected: 'ok', prompt: 'warn' };
    statusEl.textContent = STRINGS[lang][s] ? t(s) : s;
    statusEl.className = cls[s] || '';
  }

  function setVolume(v) {
    volumeState = v;
    // The mute button only shows mute state; the level is shown separately in the header.
    mute.classList.toggle('muted', !!(v && v.muted));
    mute.setAttribute('aria-pressed', v && v.muted ? 'true' : 'false');
    volume.textContent = !v ? '' : v.muted ? `🔇 ${t('muted')}` : `🔊 ${v.level}`;
  }

  function renderApps(list) {
    const ins = list.filter((a) => a.kind === 'input'), apps = list.filter((a) => a.kind === 'app');
    appsEmpty.classList.toggle('hidden', list.length > 0);
    inputsTitle.classList.toggle('hidden', !ins.length);
    appsTitle.classList.toggle('hidden', !apps.length);
    for (const [el, items] of [[inputList, ins], [appList, apps]]) {
      el.textContent = '';
      for (const a of items) {
        const b = document.createElement('button');
        b.className = 'app' + (a.kind === 'input' && a.connected === false ? ' off' : '');
        b.innerHTML = '<img alt=""><span></span>';
        const img = b.querySelector('img');
        img.src = `/icon?k=${encodeURIComponent(a.kind + ':' + a.id)}`;
        img.onerror = () => img.remove();
        b.querySelector('span').textContent = a.title;
        b.onclick = () => send({ type: a.kind === 'input' ? 'input' : 'launch', id: a.id });
        el.append(b);
      }
    }
  }

  function connect() {
    ws = new WebSocket(`ws://${location.host}`);
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.status) setStatus(m.status);
      if ('volume' in m) setVolume(m.volume);
      if (m.apps) renderApps(m.apps);
      if (m.channels) { channels = m.channels; renderChannels(); }
      if ('currentChannel' in m) markCurrent(m.currentChannel);
      if (m.searchEngine) { engine = m.searchEngine; applyLang(); }
    };
    ws.onclose = () => { setStatus('offline'); setTimeout(connect, 1500); };
  }
  applyLang();
  connect();

  document.getElementById('lang').onclick = () => {
    lang = lang === 'tr' ? 'en' : 'tr';
    try { localStorage.setItem('lang', lang); } catch {}
    applyLang();
  };

  function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

  // Diff against the previous value: delete everything after the common prefix, then type the rest.
  function sync() {
    const now = input.value;
    let i = 0;
    while (i < last.length && i < now.length && last[i] === now[i]) i++;
    const del = last.length - i, ins = now.slice(i);
    if (del || ins) send({ type: 'edit', del, ins });
    last = now;
  }

  input.addEventListener('input', sync);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); sync(); send({ type: 'enter' }); input.value = last = ''; }
    else if (e.key === 'Backspace' && input.value === '') send({ type: 'edit', del: 1, ins: '' });
  });

  function keepFocus(e) { e.preventDefault(); }
  document.querySelectorAll('button').forEach((b) => b.addEventListener('mousedown', keepFocus));

  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    const act = b.dataset.act;
    if (act === 'enter') { sync(); send({ type: 'enter' }); input.value = last = ''; }
    else if (act === 'back1') {
      if (input.value) { input.value = input.value.slice(0, -1); sync(); }
      else send({ type: 'edit', del: 1, ins: '' });
    }
    else if (act === 'clear') { send({ type: 'edit', del: Math.max(last.length, 50), ins: '' }); input.value = last = ''; }
  }));

  document.querySelectorAll('[data-btn]').forEach((b) => b.addEventListener('click', () => {
    if (navigator.vibrate) navigator.vibrate(10);
    send({ type: 'button', name: b.dataset.btn });
  }));
  power.onclick = () => { if (navigator.vibrate) navigator.vibrate(30); send({ type: 'power' }); };

  const tabs = { kb: [tabKb, kbView], yt: [tabYt, ytView], web: [tabWeb, webView], ch: [tabCh, chView], apps: [tabApps, appsView] };
  function show(name) {
    for (const [k, [tab, view]] of Object.entries(tabs)) {
      tab.classList.toggle('on', k === name);
      view.classList.toggle('hidden', k !== name);
    }
    try { localStorage.setItem('tab', name); } catch {}
  }
  tabKb.onclick = () => show('kb');
  tabYt.onclick = () => { show('yt'); ytQ.focus(); };
  tabWeb.onclick = () => show('web');
  tabApps.onclick = () => show('apps');
  tabCh.onclick = () => show('ch');
  try { const t = localStorage.getItem('tab'); if (tabs[t]) show(t); } catch {}

  msgForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = msgText.value.trim();
    if (!message) return;
    msgStatus.textContent = '';
    try {
      const res = await fetch('/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: msgHead.value.trim(), message, seconds: Number(msgSecs.value) }),
      });
      msgStatus.textContent = res.ok ? t('msgSent') : res.status === 503 ? t('msgOff') : t('msgFailed');
      if (res.ok) { msgText.value = ''; msgText.blur(); }
    } catch {
      msgStatus.textContent = t('msgFailed');
    }
  });

  webForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = webQ.value.trim();
    if (!q) return;
    send({ type: 'open', q });
    webStatus.textContent = t('opening', { q });
    webQ.value = '';
    webQ.blur();
  });

  ytForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = ytQ.value.trim();
    if (!q) return;
    ytQ.blur();
    ytResults.textContent = t('searching');
    try {
      const list = await (await fetch(`/yt?q=${encodeURIComponent(q)}&hl=${lang}`)).json();
      ytResults.textContent = list.length ? '' : t('noResults');
      for (const v of list) {
        const b = document.createElement('button');
        b.className = 'vid';
        b.innerHTML = '<img loading="lazy"><div><b></b><small></small></div>';
        b.querySelector('img').src = v.thumb;
        b.querySelector('b').textContent = v.title;
        b.querySelector('small').textContent = `${v.channel || ''} · ${v.duration || t('live')}`;
        b.onclick = () => send({ type: 'play', id: v.id });
        ytResults.append(b);
      }
    } catch { ytResults.textContent = t('searchFailed'); }
  });

  // Channels: the list comes from the TV; program info is fetched only for rows on screen.
  const epg = new Map(), wanted = new Set();
  const fmt = (ms) => new Date(ms).toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' });
  const norm = (x) => x.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i');

  const seen = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting && !epg.has(e.target.dataset.id)) wanted.add(e.target.dataset.id);
    clearTimeout(seen.timer);
    seen.timer = setTimeout(fetchEpg, 150);
  });

  async function fetchEpg() {
    const ids = [...wanted].slice(0, 40);
    if (!ids.length) return;
    ids.forEach((id) => wanted.delete(id));
    try {
      const data = await (await fetch('/epg?ids=' + encodeURIComponent(ids.join(',')))).json();
      for (const [id, programs] of Object.entries(data)) { epg.set(id, programs); paintRow(id); }
    } catch {}
    if (wanted.size) fetchEpg();
  }

  function paintRow(id) {
    const row = chList.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!row) return;
    const now = Date.now();
    const progs = (epg.get(id) || []).filter((p) => p.end > now);
    const [cur, nxt] = progs;
    const nowEl = row.querySelector('.now'), bar = row.querySelector('.bar i');
    if (!epg.has(id)) { nowEl.textContent = ''; return; }
    if (!cur) { nowEl.textContent = t('noInfo'); bar.style.width = '0'; return; }
    if (cur.start > now) {
      nowEl.textContent = `${t('next')} ${fmt(cur.start)}: ${cur.title}`;
      bar.style.width = '0';
      return;
    }
    nowEl.textContent = `${fmt(cur.start)}–${fmt(cur.end)}  ${cur.title}` + (nxt ? `  ·  ${t('next')}: ${nxt.title}` : '');
    bar.style.width = Math.min(100, (now - cur.start) / (cur.end - cur.start) * 100) + '%';
  }

  function renderChannels() {
    chEmpty.classList.toggle('hidden', channels.length > 0);
    const q = norm(chQ.value.trim());
    const list = channels.filter((c) => c.radio === showRadio && (!q || norm(c.name).includes(q) || c.number.startsWith(q)));
    seen.disconnect();
    chList.textContent = '';
    for (const c of list) {
      const b = document.createElement('button');
      b.className = 'ch' + (c.id === current ? ' current' : '');
      b.dataset.id = c.id;
      b.innerHTML = '<span class="num"></span><span class="name"></span><span class="now"></span><span class="bar"><i></i></span>';
      b.querySelector('.num').textContent = c.number;
      b.querySelector('.name').textContent = c.name;
      b.onclick = () => { if (navigator.vibrate) navigator.vibrate(10); send({ type: 'channel', id: c.id }); markCurrent(c.id); };
      chList.append(b);
      paintRow(c.id);
      seen.observe(b);
    }
  }

  function markCurrent(id) {
    current = id;
    chList.querySelectorAll('.ch').forEach((b) => b.classList.toggle('current', b.dataset.id === id));
  }

  chQ.addEventListener('input', renderChannels);
  chRadio.onclick = () => { showRadio = !showRadio; chRadio.classList.toggle('on', showRadio); renderChannels(); };
  // Keep progress bars moving and pick up the next program when one ends.
  setInterval(() => {
    const now = Date.now();
    for (const b of chList.querySelectorAll('.ch')) {
      const progs = epg.get(b.dataset.id);
      if (progs && progs[0] && progs[0].end <= now && !progs[1]) { epg.delete(b.dataset.id); wanted.add(b.dataset.id); }
      paintRow(b.dataset.id);
    }
    fetchEpg();
  }, 60000);

  // Touchpad: one finger moves the cursor, a short tap clicks, two fingers scroll.
  // Movement is accumulated and sent once per frame so the server isn't flooded.
  const SPEED = 1.6;
  let touch = null, acc = { dx: 0, dy: 0, sx: 0, sy: 0 }, frame = 0;
  function flush() {
    frame = 0;
    if (acc.dx || acc.dy) send({ type: 'pointer', kind: 'move', dx: Math.round(acc.dx), dy: Math.round(acc.dy) });
    if (acc.sy || acc.sx) send({ type: 'pointer', kind: 'scroll', dx: Math.round(acc.sx), dy: Math.round(acc.sy) });
    acc = { dx: 0, dy: 0, sx: 0, sy: 0 };
  }
  function center(t) {
    let x = 0, y = 0;
    for (const p of t) { x += p.clientX; y += p.clientY; }
    return { x: x / t.length, y: y / t.length };
  }
  touchpad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const c = center(e.touches);
    touch = { ...c, start: Date.now(), moved: 0, fingers: Math.max(touch?.fingers || 0, e.touches.length) };
    touchpad.classList.add('active');
  }, { passive: false });
  touchpad.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!touch) return;
    const c = center(e.touches), dx = c.x - touch.x, dy = c.y - touch.y;
    touch.x = c.x; touch.y = c.y; touch.moved += Math.abs(dx) + Math.abs(dy);
    if (e.touches.length >= 2) { acc.sx += -dx; acc.sy += -dy; }
    else { acc.dx += dx * SPEED; acc.dy += dy * SPEED; }
    if (!frame) frame = requestAnimationFrame(flush);
  }, { passive: false });
  touchpad.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (e.touches.length) { const c = center(e.touches); touch.x = c.x; touch.y = c.y; return; }
    if (touch && touch.fingers === 1 && touch.moved < 10 && Date.now() - touch.start < 300) {
      if (navigator.vibrate) navigator.vibrate(10);
      send({ type: 'pointer', kind: 'click' });
    }
    touch = null;
    touchpad.classList.remove('active');
  }, { passive: false });
</script>
</body>
</html>
